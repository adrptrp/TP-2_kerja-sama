<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Cellular Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header__container">
            <div class="header__logo">Cellular Hub</div>
            <nav class="header__nav">
                <a href="shop.html">Shop</a>
                <a href="support.html">Support</a>
                <a href="myaccount.html">My Account</a>
            </nav>
            <div class="header__actions">
                <input type="text" class="header__search" placeholder="Search...">
                <div class="header__user">
                    <img src="assets/user.png" alt="User">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="content">
            <!-- Cart Section -->
            <div id="cart" class="section active">
                <h2>Keranjang Belanja</h2>
                <div id="cartItems"></div>
                <div id="cartTotal" class="cart-total" style="display: none;">
                    Total: Rp <span id="totalAmount">0</span>
                </div>
                <button class="btn btn-primary" onclick="checkout()" style="margin-top: 20px; display: none;" id="checkoutBtn">
                    Checkout
                </button>
            </div>

            <!-- Admin Section -->
            <div id="admin" class="section">
                <h2>Panel Admin</h2>
                
                <div class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalProducts">0</div>
                        <div>Total Produk</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalOrders">0</div>
                        <div>Total Pesanan</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalRevenue">0</div>
                        <div>Total Pendapatan</div>
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <h3>Tambah Produk Baru</h3>
                    <form id="addProductForm">
                        <div class="form-group">
                            <label>Nama Produk</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Harga</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Deskripsi</label>
                            <textarea id="productDescription" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Tambah Produk</button>
                    </form>
                </div>

                <div>
                    <h3>Daftar Pesanan</h3>
                    <div id="ordersList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__links">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
        <div class="footer__copyright">
            <div class="footer__socials">
                <img src="assets/twitter.png" alt="Twitter">
                <img src="assets/facebook.png" alt="Facebook">
                <img src="assets/instagram.png" alt="Instagram">
            </div>
            <span>&copy;2024 Cellular Hub. All rights reserved.</span>
        </div>
    </footer>

    <script>
        // Simulasi database dengan JavaScript objects
        let cart = [];
        let orders = [];
        let products = [
            { id: 1, name: "Samsung Galaxy S24 Ultra", price: 19999000, description: "Flagship performance with 200MP camera and S Pen.", image: "assets/samsung_galaxy_s24_ultra.png" },
            { id: 2, name: "iPhone 15 Pro Max", price: 21999000, description: "Stunning titanium build with A17 Pro chip.", image: "assets/iphone_15_pro_max.png" },
            { id: 3, name: "Xiaomi 13T Pro", price: 9999000, description: "Powerful performance with 144Hz display.", image: "assets/xiaomi_13t_pro.png" },
            { id: 4, name: "Realme C55", price: 2899000, description: "Budget phone with 90Hz display and fast charging.", image: "assets/realme_c55.png" },
            { id: 5, name: "ASUS ROG Phone 7", price: 12999000, description: "Gaming phone with 165Hz display and AirTrigger.", image: "assets/asus_rog_phone_7.png" },
            { id: 6, name: "Samsung Galaxy A54 5G", price: 5999000, description: "Mid-range phone with Super AMOLED display.", image: "assets/samsung_galaxy_a54_5g.png" }
        ];
        let nextProductId = products.length + 1;
        let nextOrderId = 1;

        // Show section function
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
            
            if (sectionId === 'cart') {
                loadCart();
            } else if (sectionId === 'admin') {
                loadAdmin();
            }
        }

        // Load cart
        function loadCart() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">Keranjang kosong</p>';
                cartTotal.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }
            
            cartItems.innerHTML = '';
            let total = 0;
            
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <span style="color: #666;">Rp ${item.price.toLocaleString('id-ID')} x ${item.quantity}</span>
                    </div>
                    <div>
                        <button class="btn btn-secondary" onclick="updateQuantity(${index}, -1)" style="padding: 5px 10px; margin-right: 5px;">-</button>
                        <span style="margin: 0 10px; font-weight: bold;">${item.quantity}</span>
                        <button class="btn btn-secondary" onclick="updateQuantity(${index}, 1)" style="padding: 5px 10px; margin-left: 5px;">+</button>
                        <button class="btn" onclick="removeFromCart(${index})" style="background: #ff4757; color: white; padding: 5px 10px; margin-left: 10px;">🗑️</button>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });
            
            document.getElementById('totalAmount').textContent = total.toLocaleString('id-ID');
            cartTotal.style.display = 'block';
            checkoutBtn.style.display = 'inline-block';
        }

        // Update quantity
        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            loadCart();
        }

        // Remove from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            loadCart();
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const order = {
                id: nextOrderId++,
                date: new Date().toLocaleString('id-ID'),
                items: [...cart],
                total: total,
                status: 'Pending'
            };
            
            orders.push(order);
            cart = [];
            
            // Show success message
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = `
                <div class="success-message">
                    <h3>✅ Pesanan Berhasil!</h3>
                    <p>Terima kasih atas pesanan Anda. ID Pesanan: #${order.id}</p>
                    <p>Total: Rp ${total.toLocaleString('id-ID')}</p>
                </div>
            `;
            
            document.getElementById('cartTotal').style.display = 'none';
            document.getElementById('checkoutBtn').style.display = 'none';
        }

        // Load admin panel
        function loadAdmin() {
            // Update stats
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalOrders').textContent = orders.length;
            const totalRevenue = orders.reduce((sum, order) => sum + order.total, 0);
            document.getElementById('totalRevenue').textContent = 'Rp ' + totalRevenue.toLocaleString('id-ID');
            
            // Load orders
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';
            
            if (orders.length === 0) {
                ordersList.innerHTML = '<p style="color: #666;">Belum ada pesanan</p>';
                return;
            }
            
            orders.forEach(order => {
                const orderDiv = document.createElement('div');
                orderDiv.style.cssText = 'background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px;';
                
                const itemsList = order.items.map(item => 
                    `${item.name} (${item.quantity}x)`
                ).join(', ');
                
                orderDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>Pesanan #${order.id}</strong><br>
                            <span style="color: #666;">${order.date}</span><br>
                            <span style="font-size: 0.9em;">${itemsList}</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: bold; color: #667eea;">Rp ${order.total.toLocaleString('id-ID')}</div>
                            <span style="background: #ffeaa7; padding: 4px 8px; border-radius: 5px; font-size: 0.8em;">${order.status}</span>
                        </div>
                    </div>
                `;
                ordersList.appendChild(orderDiv);
            });
        }

        // Add product form handler
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('productName').value;
            const price = parseInt(document.getElementById('productPrice').value);
            const description = document.getElementById('productDescription').value;
            
            products.push({
                id: nextProductId++,
                name: name,
                price: price,
                description: description,
                image: "assets/default_product.png"
            });
            
            // Reset form
            this.reset();
            
            // Show success
            alert('Produk berhasil ditambahkan!');
            
            // Reload admin stats
            loadAdmin();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
        });
    </script>
</body>
</html>
