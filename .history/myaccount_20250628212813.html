<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Cellular Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
  <style>
    .account-container { max-width: 400px; margin: 3rem auto; background: #fff; border-radius: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 2.5rem 2rem; }
    .account-title { font-size: 2rem; font-weight: 800; color: #667eea; margin-bottom: 2rem; text-align: center; }
    .account-form label { font-weight: 600; color: #333; margin-bottom: 0.3rem; display: block; }
    .account-form input { width: 100%; padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid #eee; margin-bottom: 1.2rem; font-size: 1rem; }
    .account-form button { width: 100%; background: #667eea; color: #fff; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 10px; padding: 1rem 0; cursor: pointer; transition: background 0.2s; }
    .account-form button:hover { background: #4c51bf; }
    .account-info { text-align: center; }
    .account-info h2 { color: #667eea; margin-bottom: 0.7rem; }
    .logout-btn { background: #f59e42; color: #fff; border: none; border-radius: 10px; padding: 0.7rem 2rem; font-size: 1rem; font-weight: 700; margin-top: 1.5rem; cursor: pointer; transition: background 0.2s; }
    .logout-btn:hover { background: #b4690e; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__container">
      <div class="header__logo">Cellular Hub</div>
      <nav class="header__nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="support.html">Support</a>
        <a href="myaccount.html" class="active">My Account</a>
      </nav>
      <div class="header__actions">
        <div class="header__user">
          <img src="assets/user.png" alt="User">
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="account-container" id="account-container">
      <!-- Konten akun akan diisi oleh JS -->
    </div>
  </main>
  <footer class="footer">
    <div class="footer__links">
      <a href="#">About Us</a>
      <a href="#">Contact</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </div>
    <div class="footer__copyright">
      <div class="footer__socials">
        <img src="assets/twitter.png" alt="Twitter">
        <img src="assets/facebook.png" alt="Facebook">
        <img src="assets/instagram.png" alt="Instagram">
      </div>
      <span>&copy;2024 Cellular Hub. All rights reserved.</span>
    </div>
  </footer>
  <script>
    function renderAccount() {
      const container = document.getElementById('account-container');
      const user = JSON.parse(localStorage.getItem('user'));
      if (user) {
        container.innerHTML = `
          <div class="account-info">
            <h2>Selamat datang, ${user.email}!</h2>
            <p>Akun Anda sudah login.</p>
            <button class="logout-btn" onclick="logoutAccount()">Logout</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="account-title">Login Akun</div>
          <form class="account-form" onsubmit="loginAccount(event)">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit">Login</button>
          </form>
        `;
      }
    }
    function loginAccount(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      // Dummy login: simpan email ke localStorage
      localStorage.setItem('user', JSON.stringify({ email }));
      renderAccount();
    }
    function logoutAccount() {
      localStorage.removeItem('user');
      renderAccount();
    }
    document.addEventListener('DOMContentLoaded', renderAccount);
  </script>
</body>
</html>
